# Memev's own development checks. One short job runs on every pull request and again on every push to main, so a
# landing that breaks main shows on main itself. Actions minutes are a shared budget. Windows (a preview) runs only on a
# push to main or a release tag, never on a pull request, so pull requests cost no Windows minutes. Slow suites (the Docker smoke test, the 170M-token growth bench, the macOS run) are
# run locally before merging: scripts/docker-smoke.sh, scripts/growth-bench.mjs.
# The Memev product never installs workflows into a user's repositories.
name: ci
on:
  pull_request:
    paths:
      - 'src/**'
      - 'bin/**'
      - 'vendor/**'
      - 'templates/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'CHANGELOG.md'
      - 'changelog.d/**'
      - 'docs/**'
      - 'Dockerfile'
      - '.github/workflows/**'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'src/**'
      - 'bin/**'
      - 'vendor/**'
      - 'templates/**'
      - 'test/**'
      - 'scripts/**'
      - 'package.json'
      - 'CHANGELOG.md'
      - 'Dockerfile'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  # one run per pull request or per ref: a newer push to main cancels the run it supersedes
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # pull requests, and every push to main (a release tag is built by release.yml instead)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm test
      - name: CHANGELOG.md changes only at a release (notes go in changelog.d/)
        # on a pull request the base is the target branch; on a push to main, main as it was before the push
        env:
          GUARD_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        run: node scripts/changelog-assemble.mjs --guard "$GUARD_BASE"
      - name: Leak scan (files and every commit message)
        run: node scripts/leak-scan.mjs --history
      - name: gitleaks (pinned release, checksum verified)
        run: |
          V=8.30.1
          SUM=551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          curl -sSLo gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "${SUM}  gl.tgz" | sha256sum -c -
          tar xzf gl.tgz gitleaks && rm gl.tgz
          ./gitleaks git --redact --no-banner --exit-code 1 .
  windows:
    # the parts that differ on Windows: registering apps (node.exe, settings files), hooks, MCP and the doctor.
    # There are no dependencies and no lockfile, so there is nothing to install.
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: node --test --test-concurrency=2 test/windows.test.mjs test/clients.test.mjs test/jsonc.test.mjs test/continuity.test.mjs test/protocol-once.test.mjs test/doctor.test.mjs
