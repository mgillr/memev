<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">Memev connective infrastructure for AI</title>
<desc id="desc">AI providers, memory systems, agents, services, people and machines connect through Memev shared communications and context. Federation extends across personal devices, teams, departments and organisations. Memev connects these systems rather than replacing them.</desc>
<defs>
  <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#182d48"/><stop offset="1" stop-color="#345f86"/></linearGradient>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#edf4fa"/><stop offset="1" stop-color="#f8fafc"/></linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#16324a" flood-opacity=".12"/></filter>
  <style>
    .label{font:600 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#1d3348}
    .sub{font:16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#52677a}
    .coretitle{font:700 38px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}
    .coresub{font:17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#e6f0f8}
    .boundary{font:600 15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#52677a;letter-spacing:1.5px}
    .line{stroke:#7895ad;stroke-width:3;fill:none;stroke-linecap:round}
    .node{fill:#fff;stroke:#c7d6e2;stroke-width:2}
  </style>
</defs>
<rect width="1200" height="640" rx="28" fill="url(#wash)"/>
<text x="600" y="46" text-anchor="middle" class="boundary">CONNECT THE AI SYSTEMS YOU ALREADY USE</text>
<g class="line">
 <path d="M600 270 L600 190"/><path d="M455 305 L330 205"/><path d="M745 305 L870 205"/>
 <path d="M455 375 L330 465"/><path d="M745 375 L870 465"/><path d="M600 410 L600 495"/>
</g>
<g filter="url(#shadow)">
 <rect x="420" y="260" width="360" height="160" rx="24" fill="url(#core)"/>
 <rect x="455" y="302" width="290" height="1" fill="#9bb6cd" opacity=".55"/>
</g>
<text x="600" y="326" text-anchor="middle" class="coretitle">Memev</text>
<text x="600" y="360" text-anchor="middle" class="coresub">Shared communications</text>
<text x="600" y="386" text-anchor="middle" class="coresub">and authorised context</text>
<g filter="url(#shadow)">
 <rect class="node" x="445" y="92" width="310" height="98" rx="18"/>
 <rect class="node" x="95" y="145" width="260" height="100" rx="18"/>
 <rect class="node" x="845" y="145" width="260" height="100" rx="18"/>
 <rect class="node" x="95" y="430" width="260" height="100" rx="18"/>
 <rect class="node" x="845" y="430" width="260" height="100" rx="18"/>
 <rect class="node" x="445" y="495" width="310" height="100" rx="18"/>
</g>
<g text-anchor="middle">
 <text x="600" y="132" class="label">AI providers</text><text x="600" y="160" class="sub">Models and AI applications</text>
 <text x="225" y="185" class="label">Memory systems</text><text x="225" y="213" class="sub">Personal and external stores</text>
 <text x="975" y="185" class="label">Agents</text><text x="975" y="213" class="sub">Frameworks and custom agents</text>
 <text x="225" y="470" class="label">Services</text><text x="225" y="498" class="sub">Business apps and tools</text>
 <text x="975" y="470" class="label">People</text><text x="975" y="498" class="sub">Users, teams and operators</text>
 <text x="600" y="535" class="label">Machines and locations</text><text x="600" y="563" class="sub">Computers, nodes and sites</text>
</g>
<path d="M55 610 H1145" stroke="#c7d6e2" stroke-width="1.5"/>
<text x="600" y="632" text-anchor="middle" class="sub">One useful personal product — the same foundations scale towards organisation-wide AI and federation</text>
</svg>