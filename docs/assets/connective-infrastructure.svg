<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1216" viewBox="0 0 1200 1216" role="img" aria-labelledby="title desc">
<title id="title">Memev system diagram: a personal side and an organisation side that never mix</title>
<desc id="desc">A system diagram in two separate parts. The personal side: AI apps and agents connect over MCP to the Memev app, which reads and writes the personal vault; the vault is backed up to your own private git remote. That is the free core, on one computer, built today. Personal with more computers, the paid tier, adds up to three of your own computers that reach the same vault over the secure link, each with its own key; merging simultaneous edits is planned. A bar separates the two sides: personal vaults and company vaults have separate identities and keys and nothing crosses. The organisation side is planned. Business: members' computers and business systems feed one company vault, which has an admin console and an executive view for business inference intelligence. Corporate: site nodes, each keeping its own memory and authority, exchange authorised state with the company vault. Federated: other organisations share only what each agreement permits. Underneath sits the CRDT-Merge convergence engine, a separate engine each vault and node calls to merge edits.</desc>
