 .tag{font:700 16px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:1.5px;fill:#2f6da3}.tagnow{font:700 16px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:1.5px;fill:#2e7d5b}
 .wlabel{font:700 17px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:2px;fill:#cfe0f2}.wtitle{font:700 30px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}.wbody{font:19px system-ui,-apple-system,Segoe UI,sans-serif;fill:#eef5fb}
 .tt{font:700 21px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}.tb{font:18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#cfe0ee}
 .rt{font:700 19px system-ui,-apple-system,Segoe UI,sans-serif;fill:#19344c}.rb{font:17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#506579}
 .foot{font:18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#536a7d}.foot2{font:16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#60788d}
 .card{fill:#fff;stroke:#cfdae4;stroke-width:2}.tile{fill:#1e3d5c}.line{stroke:#89a2b7;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.arrow{fill:#89a2b7}
 </style>
</defs>
<rect width="1600" height="1180" rx="28" fill="url(#bg)"/>
<text x="800" y="62" text-anchor="middle" class="eyebrow">THE INFRASTRUCTURE LAYER FOR CONNECTED AI</text>
<text x="800" y="108" text-anchor="middle" class="h">From people's work to intelligence leaders can trust</text>
<text x="800" y="146" text-anchor="middle" class="sub">Connect the AI you already use. Govern what it may see and do. Ask the whole organisation.</text>

<g filter="url(#shadow)">
 <rect x="100" y="180" width="1400" height="130" rx="18" fill="url(#exec)"/>
 <rect class="card" x="100" y="340" width="320" height="125" rx="16"/><rect class="card" x="460" y="340" width="320" height="125" rx="16"/><rect class="card" x="820" y="340" width="320" height="125" rx="16"/><rect class="card" x="1180" y="340" width="320" height="125" rx="16"/>
 <rect x="100" y="495" width="1400" height="230" rx="20" fill="url(#core)"/>
 <rect class="card" x="100" y="755" width="1400" height="105" rx="16"/>
 <rect class="card" x="100" y="928" width="320" height="140" rx="16"/><rect class="card" x="460" y="928" width="320" height="140" rx="16"/><rect class="card" x="820" y="928" width="320" height="140" rx="16"/><rect class="card" x="1180" y="928" width="320" height="140" rx="16"/>
</g>

<g>
 <text x="130" y="222" class="wlabel">EXECUTIVE VIEW · PLANNED</text>
 <text x="130" y="266" class="wtitle">Business inference intelligence</text>
 <text x="700" y="222" class="wbody">Leaders ask across the organisation, from the top down</text>
 <text x="700" y="252" class="wbody">Every answer shows its sources</text>
 <text x="700" y="282" class="wbody">AI inference stays labelled until a person confirms it</text>
</g>

<g class="line"><path d="M800 310 V495"/><path d="M260 465 V495"/><path d="M620 465 V495"/><path d="M980 465 V495"/><path d="M1340 465 V495"/><path d="M800 725 V755"/></g>

<g>
 <text x="124" y="382" class="ct">People and their work</text><text x="124" y="414" class="body">Plans · decisions · tasks</text><text x="124" y="440" class="body">Schedules · budgets · results</text>
 <text x="484" y="382" class="ct">AI apps and agents</text><text x="484" y="414" class="body">Any provider · any model</text><text x="484" y="440" class="body">Change them at any time</text>
 <text x="844" y="382" class="ct">Business applications</text><text x="844" y="414" class="body">CRM · ERP · finance</text><text x="844" y="440" class="body">Engineering · operations</text>
 <text x="1204" y="382" class="ct">Data systems</text><text x="1204" y="414" class="body">Knowledge stores · databases</text><text x="1204" y="440" class="body">Permitted data views</text>
</g>

<text x="130" y="535" class="wlabel">MEMEV · THE INFRASTRUCTURE LAYER</text>
<g>
 <rect class="tile" x="130" y="555" width="256" height="145" rx="12"/><rect class="tile" x="402" y="555" width="256" height="145" rx="12"/><rect class="tile" x="674" y="555" width="256" height="145" rx="12"/><rect class="tile" x="946" y="555" width="256" height="145" rx="12"/><rect class="tile" x="1218" y="555" width="256" height="145" rx="12"/>
 <text x="148" y="599" class="tt">Shared context</text><text x="148" y="633" class="tb">One record of the work</text><text x="148" y="659" class="tb">across people and tools</text>
 <text x="420" y="599" class="tt">Coordination</text><text x="420" y="633" class="tb">Hand-offs between</text><text x="420" y="659" class="tb">people and AI</text>
 <text x="692" y="599" class="tt">Authority</text><text x="692" y="633" class="tb">Who may see and act,</text><text x="692" y="659" class="tb">under which rules</text>
 <text x="964" y="599" class="tt">Evidence</text><text x="964" y="633" class="tb">What was done,</text><text x="964" y="659" class="tb">and what was checked</text>
 <text x="1236" y="599" class="tt">Convergence</text><text x="1236" y="633" class="tb">One agreed result</text><text x="1236" y="659" class="tb">(planned)</text>
</g>

<g>
 <text x="130" y="797" class="tag">AI KEPT INSIDE THE RULES</text><text x="130" y="826" class="rb">What AI may see, do and claim</text>
 <text x="500" y="797" class="rt">Scoped access</text><text x="500" y="826" class="rb">revocable per credential</text>
 <text x="760" y="797" class="rt">Signed work</text><text x="760" y="826" class="rb">checks and stop rules</text>
 <text x="1010" y="797" class="rt">Append-only record</text><text x="1010" y="826" class="rb">changes can be undone</text>
 <text x="1260" y="797" class="rt">Off by default</text><text x="1260" y="826" class="rb">cloud access is opt-in</text>
</g>

<text x="800" y="906" text-anchor="middle" class="eyebrow">ONE LAYER, AT EVERY SCALE</text>
<g>
 <text x="124" y="962" class="tagnow">PERSONAL · PREVIEW TODAY</text><text x="124" y="998" class="ct">One person</text><text x="124" y="1028" class="body">Your AI tools share one</text><text x="124" y="1052" class="body">context, on your computer</text>
 <text x="484" y="962" class="tag">BUSINESS · PLANNED</text><text x="484" y="998" class="ct">One company</text><text x="484" y="1028" class="body">Teams and their AI share one</text><text x="484" y="1052" class="body">company record and its rules</text>
 <text x="844" y="962" class="tag">CORPORATE · PLANNED</text><text x="844" y="998" class="ct">Many sites</text><text x="844" y="1028" class="body">Sites in many countries; each</text><text x="844" y="1052" class="body">keeps its own authority</text>
 <text x="1204" y="962" class="tag">FEDERATED · PLANNED</text><text x="1204" y="998" class="ct">Many organisations</text><text x="1204" y="1028" class="body">Partners and suppliers share</text><text x="1204" y="1052" class="body">only what they agree to</text>
</g>
<g class="arrow"><path d="M428 990 h12 v-8 l14 16 l-14 16 v-8 h-12 z"/><path d="M788 990 h12 v-8 l14 16 l-14 16 v-8 h-12 z"/><path d="M1148 990 h12 v-8 l14 16 l-14 16 v-8 h-12 z"/></g>

<text x="800" y="1112" text-anchor="middle" class="foot">Works with the AI you already use · no shared global vault · no central ownership of participant data</text>
<text x="800" y="1144" text-anchor="middle" class="foot2">The free core for one person is a development preview. Everything marked planned is not built yet.</text>
</svg>
