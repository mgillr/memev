<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">Memev: the infrastructure layer between any AI application and an organisation's work</title>
<desc id="desc">Read from the top down. A planned executive view lets leaders ask across the organisation and get answers that show their evidence. People, AI applications and agents, business applications and data systems connect to Memev, the infrastructure layer, which supplies shared context, coordination, authority, evidence and planned convergence. Connected AI is kept inside the rules by scoped access, signed work with checks, an append-only record and cloud access that is off by default. The same layer serves one person today, in preview, and is planned for one company, many sites and many organisations.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#e8eff6"/></linearGradient>
 <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#132b45"/><stop offset="1" stop-color="#315c80"/></linearGradient>
 <linearGradient id="exec" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1f4e79"/><stop offset="1" stop-color="#2f6da3"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18344d" flood-opacity=".12"/></filter>
 <style>
 .h{font:700 38px system-ui,-apple-system,Segoe UI,sans-serif;fill:#172f46}.sub{font:20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#536a7d}
 .ct{font:700 22px system-ui,-apple-system,Segoe UI,sans-serif;fill:#19344c}.body{font:18px system-ui,-apple-system,Segoe UI,sans-serif;fill:#506579}
