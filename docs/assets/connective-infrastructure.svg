<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title desc">
<title id="title">Memev connects work and intelligence across independent organisations</title>
<desc id="desc">People, AI agents, business applications and data systems contribute authorised work to independent organisation nodes. Each node keeps its own vault, authority, policies and trust root. Bilateral federated relationships connect only approved work, evidence, programme context and computation. Authorised AI and analytics produce cross-organisation insight under sovereignty and provenance controls.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f7fb"/><stop offset="1" stop-color="#e8eff6"/></linearGradient>
 <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#132b45"/><stop offset="1" stop-color="#315c80"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#18344d" flood-opacity=".12"/></filter>
 <style>
 .h{font:700 34px system-ui,-apple-system,Segoe UI,sans-serif;fill:#172f46}.sub{font:17px system-ui,-apple-system,Segoe UI,sans-serif;fill:#536a7d}
 .ct{font:700 20px system-ui,-apple-system,Segoe UI,sans-serif;fill:#19344c}.body{font:15px system-ui,-apple-system,Segoe UI,sans-serif;fill:#506579}
 .coretitle{font:700 27px system-ui,-apple-system,Segoe UI,sans-serif;fill:#fff}.corebody{font:16px system-ui,-apple-system,Segoe UI,sans-serif;fill:#e6f0f8}
 .eyebrow{font:700 14px system-ui,-apple-system,Segoe UI,sans-serif;letter-spacing:2px;fill:#60788d}
 .card{fill:#fff;stroke:#cfdae4;stroke-width:2}.line{stroke:#89a2b7;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
 .dash{stroke:#64839d;stroke-width:3;stroke-dasharray:9 8;fill:none}
 </style>
</defs>
<rect width="1600" height="1180" rx="28" fill="url(#bg)"/>
<text x="800" y="48" text-anchor="middle" class="eyebrow">THE CONNECTIVE INFRASTRUCTURE FOR AI</text>
<text x="800" y="91" text-anchor="middle" class="h">From people's work to industry-wide intelligence</text>
<text x="800" y="122" text-anchor="middle" class="sub">Connect the systems. Govern the work. Coordinate across organisational boundaries.</text>
<g filter="url(#shadow)">
 <rect class="card" x="65" y="160" width="340" height="145" rx="18"/><rect class="card" x="440" y="160" width="340" height="145" rx="18"/><rect class="card" x="815" y="160" width="340" height="145" rx="18"/><rect class="card" x="1190" y="160" width="345" height="145" rx="18"/>
 <rect x="75" y="365" width="455" height="250" rx="22" fill="#fff" stroke="#9eb2c3" stroke-width="2"/><rect x="572" y="365" width="456" height="250" rx="22" fill="#fff" stroke="#9eb2c3" stroke-width="2"/><rect x="1070" y="365" width="455" height="250" rx="22" fill="#fff" stroke="#9eb2c3" stroke-width="2"/>
 <rect x="235" y="715" width="1130" height="220" rx="24" fill="url(#core)"/><rect class="card" x="95" y="980" width="680" height="115" rx="18"/><rect class="card" x="825" y="980" width="680" height="115" rx="18"/>
</g>
<g>
 <text x="95" y="202" class="ct">People and their work</text><text x="95" y="238" class="body">Plans · documents · decisions · tasks</text><text x="95" y="266" class="body">Schedules · budgets · specifications</text>
 <text x="470" y="202" class="ct">AI providers and agents</text><text x="470" y="238" class="body">Models · inference · sessions · tools</text><text x="470" y="266" class="body">Contribute work and consume context</text>
 <text x="845" y="202" class="ct">Business applications</text><text x="845" y="238" class="body">CRM · ERP · finance · procurement</text><text x="845" y="266" class="body">Engineering · operations · collaboration</text>
 <text x="1220" y="202" class="ct">Data and memory systems</text><text x="1220" y="238" class="body">Knowledge stores · databases · BI</text><text x="1220" y="266" class="body">References · permitted data views</text>
</g>
<g text-anchor="middle">
 <text x="302" y="405" class="ct">Organisation A</text><text x="302" y="438" class="body">Local node · private vault · own policy</text><text x="302" y="475" class="body">People · projects · systems · AI</text><text x="302" y="512" class="body">Independent operator and trust root</text><text x="302" y="566" class="body">Only authorised contributions leave</text>
 <text x="800" y="405" class="ct">Organisation B</text><text x="800" y="438" class="body">Local node · private vault · own policy</text><text x="800" y="475" class="body">People · projects · systems · AI</text><text x="800" y="512" class="body">Independent operator and trust root</text><text x="800" y="566" class="body">Only authorised contributions leave</text>
 <text x="1297" y="405" class="ct">Organisation C</text><text x="1297" y="438" class="body">Local node · private vault · own policy</text><text x="1297" y="475" class="body">People · projects · systems · AI</text><text x="1297" y="512" class="body">Independent operator and trust root</text><text x="1297" y="566" class="body">Only authorised contributions leave</text>
</g>
<g class="dash"><path d="M530 490 H572"/><path d="M1028 490 H1070"/><path d="M302 615 V670 H800 V715"/><path d="M800 615 V715"/><path d="M1297 615 V670 H800"/></g>
<g text-anchor="middle">
 <text x="800" y="760" class="coretitle">Memev federated coordination and shared programme context</text><text x="800" y="802" class="corebody">Bilateral trust · scoped work exchange · evidence · dependencies · commitments</text><text x="800" y="842" class="corebody">Cross-organisation project, programme and portfolio relationships</text><text x="800" y="882" class="corebody">Authorised AI analysis · workload-specific computation · accountable findings</text>
 <text x="435" y="1025" class="ct">Cross-organisation intelligence</text><text x="435" y="1060" class="body">Programme health · supply-chain dependencies · risks · changes · actions</text>
 <text x="1165" y="1025" class="ct">Sovereignty and trust at every boundary</text><text x="1165" y="1060" class="body">Ownership · jurisdiction · purpose · permissions · audit · provenance</text>
</g>
<g class="line"><path d="M235 305 V330 H800 V365"/><path d="M610 305 V365"/><path d="M985 305 V330 H800"/><path d="M1360 305 V330 H800"/><path d="M800 935 V958 H435 V980"/><path d="M800 958 H1165 V980"/></g>
<text x="800" y="1140" text-anchor="middle" class="sub">No shared global vault · no transitive trust · no central ownership of participant data</text>
</svg>